<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="AndesVirusTracker">
  <title>AndesVirusTracker</title>

  <!-- Dark background -->
  <rect width="100" height="100" rx="16" ry="16" fill="#0a0c0f"/>

  <!-- Red triangle (Vercel-style, pointing up) -->
  <polygon points="50,18 84,76 16,76" fill="#ef4444"/>

  <!-- Dark cutout triangle inside for depth -->
  <polygon points="50,32 73,70 27,70" fill="#0a0c0f"/>

  <!-- Live signal dot top-right -->
  <circle cx="78" cy="22" r="7" fill="#0a0c0f"/>
  <circle cx="78" cy="22" r="4" fill="#ef4444"/>
</svg>
