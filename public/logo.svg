<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="AndesVirusTracker">
  <title>AndesVirusTracker</title>

  <!-- MARK: Background -->
  <rect width="100" height="100" rx="18" ry="18" fill="#0a0c0f"/>

  <!-- MARK: Red ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- MARK: AV wordmark -->
  <text
    x="50"
    y="50"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#ffffff"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
    font-weight="700"
    font-size="32"
    letter-spacing="-1">AV</text>

  <!-- MARK: Live signal dot -->
  <circle cx="74" cy="26" r="6" fill="#ef4444" opacity="0.25"/>
  <circle cx="74" cy="26" r="3.5" fill="#ef4444"/>
</svg>
