name: Sync Outbreak Stats

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sync-stats
        run: |
          curl -sf "https://andesvirustracker.com/api/sync-stats" \
            -H "x-vercel-cron: 1" \
            --max-time 30 \
            | jq '{ok, articlesScanned, updates: (.updates | {last_updated, day_count, breaking_news})}' \
            || echo "sync failed or no updates"
