name: Sync Outbreak Stats

# Outbreak concluded 2026-07-02 (WHO DON611). Scheduled scraping is disabled so
# it can't re-poison the frozen final stats. Re-enable the cron lines only if a
# new related cluster emerges (also flip OUTBREAK_CONCLUDED in the sync-stats route).
on:
  # schedule:
  #   - cron: '0 * * * *'   # top of every hour
  #   - cron: '15 * * * *'  # :15 past every hour
  #   - cron: '30 * * * *'  # :30 past every hour
  #   - cron: '45 * * * *'  # :45 past every hour
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sync-stats
        run: |
          curl -sf "https://andesvirustracker.com/api/sync-stats" \
            -H "x-vercel-cron: 1" \
            --max-time 30 \
            | jq '{ok, articlesScanned, newsInserted, updates: (.updates | {last_updated, day_count, breaking_news})}' \
            || echo "sync failed or no updates"
